<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Atlas · pipeline</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0f141c; }
  body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
  #app { width: 100vw; height: 100vh; }
  #app:empty::before {
    content: 'Loading Atlas…';
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: #5f7396; font-family: 'JetBrains Mono', monospace; font-size: 12px;
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
  if (location.protocol === 'file:') {
    setTimeout(() => {
      const app = document.getElementById('app');
      if (!app || app.children.length) return;
      app.innerHTML = '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#9aa9c2;font:12px JetBrains Mono,monospace;text-align:center;line-height:1.6">Open Atlas through localhost.<br/>Double-click run-atlas.command or run ./run-atlas.command.</div>';
    }, 2500);
  }
</script>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="atlas-bridge.js"></script>

<!-- Sequential fetch → Babel.transform → eval loader; cache-busted on every page load -->
<script>
(async function() {
  const v = Date.now();
  const srcs = [
    'src/shared.jsx',
    'src/graph.jsx',
    'src/scenarios.jsx',
    'src/state.jsx',
    'src/editor-node.jsx',
    'src/editor.jsx',
    'src/editor-panels.jsx',
    'src/editor-app.jsx',
  ];
  for (const src of srcs) {
    try {
      const res  = await fetch(src + '?v=' + v);
      const code = await res.text();
      const compiled = Babel.transform(code, { presets: ['react'], filename: src }).code;
      const s = document.createElement('script');
      s.textContent = compiled;
      document.head.appendChild(s);
    } catch(e) {
      console.error('Atlas loader: failed to load ' + src, e);
    }
  }
})();
</script>
</body>
</html>
