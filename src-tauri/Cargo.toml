[package]
name = "beatboard"
version = "0.9.0"
description = "Beatboard — local AI media pipeline"
authors = []
edition = "2021"
rust-version = "1.70"

[[bin]]
name = "beatboard"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
tauri = { version = "1", features = [ "window-unmaximize", "window-minimize", "window-close", "window-maximize", "window-start-dragging", "dialog-message", "dialog-open", "protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "rt-multi-thread", "sync"] }
reqwest = { version = "0.11", features = ["json", "stream"] }
tiny_http = "0.12"
flate2 = "1"
sha2 = "0.10"
tar = "0.4"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
